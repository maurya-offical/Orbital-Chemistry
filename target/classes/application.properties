spring.application.name=orbital-backend
server.port=8080

# MySQL: create the database first ->  CREATE DATABASE orbital_chemistry;
spring.datasource.url=jdbc:mysql://localhost:3306/orbital_chemistry
spring.datasource.username=root
spring.datasource.password=Shivam@12

# Creates/updates tables automatically (use Flyway/Liquibase in production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Origin of your website (change when deployed)
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500
# JWT (base64 secret, at least 32 bytes). Generate your own for production: openssl rand -base64 32
app.jwt.secret=9dQmcDi8U3/L4+TjzQF5PZLfwDwZ52u69FZFeq3WrKY=
app.jwt.expiration-ms=86400000

# First admin, created automatically on startup (or promoted if the email already exists).
# For local testing type a real password here (min 8 chars). In production use environment variables.
app.admin.email=${ADMIN_EMAIL:admin@orbitalchemistry.com}
app.admin.password=${ADMIN_PASSWORD:Shivam@12}
# Razorpay TEST keys: Dashboard > Account & Settings > API Keys (switch to Test Mode first).
# Key ID is shown to the browser. The SECRET must stay on the server only. Never commit it to Git.
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_U4h4cBJxXr6zKm}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:MLLVHtWHVmaEmzMjXQ7yNJf3}
# Only needed for the webhook (see README in the chat). Any long random string you also enter in the Razorpay dashboard.
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Where your website lives (used to build the password reset link)
app.frontend-url=http://127.0.0.1:5500/index.html
app.mail-from=no-reply@orbitalchemistry.com

# OPTIONAL: SMTP for real emails (Gmail app password, Brevo, Amazon SES...).
